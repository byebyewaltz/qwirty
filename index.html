<body>

<!-- ── Top Navigation Bar ── -->

</nav>

<!-- ── Header / Search ── -->
<header class="header">

    <input type="text" placeholder="Search for..." aria-label="Search products" id="search-input" />
    <button aria-label="Submit search">🔍</button>

</header>

<!-- ── Main Body ── -->
<div class="body-layout">

    <a class="sidebar-item" href="#" data-category="electronics">Electronics</a>
    <a class="sidebar-item" href="#" data-category="books">Books</a>
    <a class="sidebar-item" href="#" data-category="food">Food &amp; Drinks</a>
    <a class="sidebar-item" href="#" data-category="appliances">Appliances</a>
    <a class="sidebar-item" href="#" data-category="sports">Sports &amp; Outdoor</a>
    <a class="sidebar-item" href="#" data-category="toys">Toys &amp; Baby</a>
    <a class="sidebar-item" href="#" data-category="garden">Garden</a>
  </aside>

  <!-- Product Grid -->
  <main class="product-area">
    <div class="product-grid" id="product-grid"></div>
  </main>

</div>

  ];

  const grid  = document.getElementById('product-grid');
  const toast = document.getElementById('toast');
  let toastTimer;

  function renderCards(list) {
    grid.innerHTML = '';
    list.forEach(p => {
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-header">
          <h2 class="card-title">${p.name}</h2>
        </div>
        <div class="card-image-placeholder" role="img" aria-label="Product image"></div>
        <p class="card-desc">${p.desc}</p>
        <div class="card-footer">
          <span class="card-price"><span>Price: </span>$${p.price.toFixed(2)}</span>
          <button class="btn-cart" aria-label="Add ${p.name} to cart" data-id="${p.id}">🛒</button>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // Add to cart
  grid.addEventListener('click', e => {
    const btn = e.target.closest('.btn-cart');
    if (!btn) return;
    const id = +btn.dataset.id;
    const product = products.find(p => p.id === id);
    if (product) showToast(`Added "${product.name}" — $${product.price.toFixed(2)} to cart`);
  });

  // Sidebar category filter (active state only — extend with real filter logic as needed)
  document.querySelectorAll('.sidebar-item').forEach(item => {
    item.addEventListener('click', e => {
      e.preventDefault();
      document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
      item.classList.add('active');
    });
  });

  // Search filter
  document.getElementById('search-input').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    const filtered = q
      ? products.filter(p => p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q))
      : products;
    renderCards(filtered);
  });

  // Initial render
  renderCards(products);
</script>

</body>
</html>
